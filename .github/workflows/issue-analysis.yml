# Issue Analysis
#
# Runs the repo's /is prompt against an issue and posts the agent's analysis as
# a comment. Triggers on:
#   - the repository owner adding the `pi-analyze` label to an issue, or
#   - the repository owner commenting `@pia` on an issue.
# Only issues created by the repository owner are analyzed, and only the owner
# may trigger a run: the label must be applied by the owner and the `@pia`
# comment must be written by the owner. Text after `@pia` is forwarded to the
# agent as extra instructions. Pull request comments are ignored.
#
# The session export is uploaded as two unzipped artifacts, `session.jsonl` and
# `session.html`, kept for 90 days; the result comment links to them.
#
# All provider configuration comes from environment variables through the
# `.pi/extensions/ci` extension, auto-loaded from the project extension
# directory. The whole plugin only takes effect when `CI` is set:
#   - OPENAI_BASE_URL points the `openai` provider at an OpenAI-compatible
#     gateway.
#   - OPENAI_API_KEY is read by the provider itself.
# The same extension runs the model's file and shell tools (`read`, `bash`,
# `edit`, `write`) inside a bubblewrap sandbox, so generated commands cannot
# read the provider or GitHub credentials from the Pi process environment. The `Setup sandbox` step
# installs bubblewrap, ripgrep, and the AppArmor profile that lets unprivileged
# bubblewrap create user namespaces on Ubuntu 24.04.
# The GitHub MCP server used by /is is written into the agent directory by the
# `Configure GitHub MCP` step below.
#
# Setup:
#   1. Create the `pi-analyze` label.
#   2. Create a `pi-analyze` GitHub environment with `OPENAI_BASE_URL` and
#      `OPENAI_API_KEY` secrets. The model is fixed to openai/gpt-6.1-sol with
#      xhigh thinking.

name: Issue Analysis

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: issue-analysis-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  analyze:
    if: |
      github.event.issue.user.login == github.repository_owner &&
      (
        (github.event_name == 'issues' &&
         github.event.action == 'labeled' &&
         github.event.label.name == 'pi-analyze' &&
         github.event.sender.login == github.repository_owner) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request == null &&
         github.event.comment.user.login == github.repository_owner &&
         contains(github.event.comment.body, '@pia'))
      )
    runs-on: ubuntu-latest
    environment: pi-analyze
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      PI_MODEL: openai/gpt-6.1-sol
      PI_THINKING: xhigh
    outputs:
      session_jsonl_url: ${{ steps.upload-session-jsonl.outputs.artifact-url }}
      session_html_url: ${{ steps.upload-session-html.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # `lts/*` resolves to the latest LTS release at run time.
          node-version: 'lts/*'

      - name: Install pi
        run: npm install --global @earendil-works/pi-coding-agent@1.3.0

      - name: Setup sandbox
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor bubblewrap ripgrep

          # Ubuntu 24.04 blocks unprivileged user namespaces by default, which
          # bubblewrap needs to build the sandbox. Ubuntu 25.04+ ships this
          # profile in the apparmor package; 24.04 does not, so write it here.
          # Copied verbatim from Ubuntu questing's apparmor package
          # (5.0.0~alpha1-0ubuntu8.3), /etc/apparmor.d/bwrap-userns-restrict.
          sudo tee /etc/apparmor.d/bwrap-userns-restrict >/dev/null <<'EOF'
          # This profile allows almost everything and only exists to allow bwrap
          # to work on a system with user namespace restrictions being enforced.
          # bwrap is allowed access to user namespaces and capabilities within
          # the user namespace, but its children do not have capabilities,
          # blocking bwrap from being able to be used to arbitrarily by-pass the
          # user namespace restrictions.

          # Note: the bwrap child is stacked against the bwrap profile due to
          # bwraps use of no-new-privs.

          abi <abi/4.0>,

          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(attach_disconnected,mediate_deleted) {
            allow capability,
            # not allow all, to allow for pix stack on systems that don't support
            # rule priority.
            #
            # sadly we have to allow 'm' every where to allow children to work under
            # profile stacking atm.
            allow file rwlkm /{**,},
            allow network,
            allow unix,
            allow ptrace,
            allow signal,
            allow mqueue,
            allow io_uring,
            allow userns,
            allow mount,
            allow umount,
            allow pivot_root,
            allow dbus,

            # stacked like this due to no-new-privs restriction
            # this will stack a target profile against bwrap and unpriv_bwrap
            # Ideally
            # - there would be a transition at userns creation first. This would allow
            #   for the bwrap profile to be tighter, and looser within the user
            #   ns. bwrap will still have to fairly loose until a transition at
            #   namespacing in general (not just user ns) is available.
            # - there would be an independent second target as fallback
            #   This would allow for select target profiles to be used, and not
            #   necessarily stack the unpriv_bwrap in cases where this is desired
            #
            # the ix works here because stack will apply to ix fallback
            # Ideally we would sanitize the environment across a privilege boundry
            # (leaving bwarp into application) but flatpak etc use environment glibc
            # sanitized environment variables as part of the sandbox setup.
            allow pix /** -> &bwrap//&unpriv_bwrap,

            # the local include should not be used without understanding the userns
            # restriction.
            # Site-specific additions and overrides. See local/README for details.
            include if exists <local/bwrap-userns-restrict>
          }

          # The unpriv_bwrap profile is used to strip capabilities within the userns
          profile unpriv_bwrap flags=(attach_disconnected,mediate_deleted) {
            # not allow all, to allow for pix stack
            allow file rwlkm /{**,},
            allow network,
            allow unix,
            allow ptrace,
            allow signal,
            allow mqueue,
            allow io_uring,
            allow userns,
            allow mount,
            allow umount,
            allow pivot_root,
            allow dbus,

            # bwrap profile does stacking against itself this will keep the target
            # profile from having elevated privileges in the container.
            # If done recursively the stack will remove any duplicate
            allow pix /** -> &unpriv_bwrap,

            audit deny capability,

            # the local include should not be used without understanding the userns
            # restriction.
            # Site-specific additions and overrides. See local/README for details.
            include if exists <local/unpriv_bwrap>
          }
          EOF

          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict

      - name: Configure GitHub MCP
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          set -uo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          cat > "$PI_CODING_AGENT_DIR/mcp.json" <<'JSON'
          {
            "mcpServers": {
              "github": {
                "url": "https://api.githubcopilot.com/mcp/",
                "headers": { "Authorization": "Bearer ${GITHUB_TOKEN}" },
                "description": "GitHub API access used by the /is issue-analysis prompt.",
                "toolExposure": { "get_me": "direct", "issue_read": "direct" }
              }
            }
          }
          JSON

      - name: Run pi /is
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail
          out_dir="$RUNNER_TEMP/pi-out"
          mkdir -p "$out_dir/session"

          prompt="/is ${ISSUE_URL}"
          extra_instructions="$(printf '%s' "${COMMENT_BODY:-}" | sed -E 's/@pia//I')"
          extra_instructions="$(printf '%s' "$extra_instructions" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          if [ -n "$extra_instructions" ]; then
            prompt="${prompt}"$'\n\nAdditional instructions from the @pia comment:\n'"${extra_instructions}"
          fi

          set +e
          pi -p --approve \
            --session-dir "$out_dir/session" \
            --model "$PI_MODEL" \
            --thinking "$PI_THINKING" \
            "$prompt" 2>&1 | tee "$out_dir/output.md"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error::pi /is failed with exit code $status"
            exit "$status"
          fi

      - name: Export session
        if: always()
        run: |
          set -uo pipefail
          out_dir="$RUNNER_TEMP/pi-out"
          session_file="$(find "$out_dir/session" -type f -name '*.jsonl' | head -n 1)"
          if [ -z "$session_file" ]; then
            echo "No session file found; skipping export"
            exit 0
          fi
          cp "$session_file" "$out_dir/session.jsonl"
          pi --no-extensions --export "$out_dir/session.jsonl" "$out_dir/session.html" \
            || echo "Session export failed (non-fatal)"

      - name: Upload session.jsonl
        if: always()
        id: upload-session-jsonl
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # `archive: false` uploads the file unzipped; the artifact is named
          # after the file itself.
          path: ${{ runner.temp }}/pi-out/session.jsonl
          archive: false
          if-no-files-found: warn
          retention-days: 90

      - name: Upload session.html
        if: always()
        id: upload-session-html
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/pi-out/session.html
          archive: false
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: analyze
    if: always() && needs.analyze.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download session.jsonl
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: session.jsonl
          path: pi-out

      - name: Post result comment
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SESSION_JSONL_URL: ${{ needs.analyze.outputs.session_jsonl_url }}
          SESSION_HTML_URL: ${{ needs.analyze.outputs.session_html_url }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const outDir = 'pi-out';

            function readText(file) {
              try {
                return fs.readFileSync(file, 'utf8').trim();
              } catch {
                return '';
              }
            }

            function extractLastAssistantMessage(sessionPath) {
              const raw = readText(sessionPath);
              if (!raw) return '';
              let last = '';
              for (const line of raw.split(/\r?\n/)) {
                if (!line.trim()) continue;
                let entry;
                try {
                  entry = JSON.parse(line);
                } catch {
                  continue;
                }
                if (entry.type !== 'message' || entry.message?.role !== 'assistant') continue;
                const content = entry.message.content;
                const parts = [];
                if (typeof content === 'string') {
                  parts.push(content);
                } else if (Array.isArray(content)) {
                  for (const block of content) {
                    if (block?.type === 'text' && typeof block.text === 'string') {
                      parts.push(block.text);
                    }
                  }
                }
                const text = parts.join('\n\n').trim();
                if (text) last = text;
              }
              return last;
            }

            let summary = extractLastAssistantMessage(path.join(outDir, 'session.jsonl'));
            if (!summary) summary = readText(path.join(outDir, 'output.md'));

            const result = process.env.ANALYZE_RESULT;
            const maxLength = 55000;
            const artifactLinks = [
              ['session.jsonl', process.env.SESSION_JSONL_URL],
              ['session.html', process.env.SESSION_HTML_URL],
            ]
              .filter(([, url]) => url)
              .map(([label, url]) => `- [${label}](${url})`);
            const artifactSection = artifactLinks.length ? ['', ...artifactLinks] : [];
            let body;
            if (result === 'success' && summary) {
              const truncated =
                summary.length > maxLength ? `${summary.slice(0, maxLength)}\n\n_[truncated]_` : summary;
              body = [
                'Pi issue analysis finished.',
                ...artifactSection,
                '',
                '<details>',
                '<summary>Agent analysis</summary>',
                '',
                truncated,
                '',
                '</details>',
              ].join('\n');
            } else {
              body = [
                `Pi issue analysis did not complete (analyze job: ${result}).`,
                ...artifactSection,
                '',
                `Run: ${process.env.RUN_URL}`,
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Remove trigger label
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'pi-analyze',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
